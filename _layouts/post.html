---
layout: default
---
<div class="progress-wrapper"><div id="progress"></div></div>
<header class="page-header post-header">
  <p class="eyebrow">Essay</p>
  <h1>{{ page.title }}</h1>
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
</header>
<main class="prose-page post-page"><article>{{ content }}
<nav class="pagination">
{% if page.previous.url %}<a href="{{ page.previous.url }}">&laquo; {{ page.previous.title }}</a>{% endif %}
{% if page.next.url %}<a href="{{ page.next.url }}">{{ page.next.title }} &raquo;</a>{% endif %}
</nav></article></main>
